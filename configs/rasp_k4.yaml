name: rasp_k4
datasets: [wikipedia, reddit, mooc, uci, enron]
targets: [mooc, wikipedia, reddit]
seeds: [0, 1, 2, 3, 42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 128
  time_dim: 64
  num_layers: 2
  num_heads: 2
  num_neighbors: 10
  dropout: 0.1
training:
  pretrain_epochs: 25
  transfer_epochs: 20
  batch_size: 512
  total_batches_per_epoch: 160
  pretraining_strategy: conflict_aware
  affinity_temperature: 0.1
  minimum_source_batches: 1
  domain_adversarial_scale: 1.0
  domain_loss_coefficient: 0.1
proxy:
  calibration_fraction: 0.8
  calibration_steps: 100
  proxy_batch_size: 256
  proxy_batches: 12
  margin: 0.002
selection:
  selection_method: rasp
  proxy_windows: 3
  bootstrap_replicates: 1000
  bootstrap_confidence: 0.95
  risk_beta: 1.0
  size_penalty: 0.0
  beam_width: 2
  max_sources: 3
  candidate_budget: 16
  min_risk_adjusted_gain: 0.002
evaluation:
  evaluation_protocol: ranking
  negative_policy: historical
  negatives_per_positive: 100
  evaluation_batch_size: 256
