name: hrcsr_matched_control
datasets: [wikipedia, reddit, mooc, uci, enron]
targets: [wikipedia, reddit, mooc]
seeds: [0, 1, 2, 3, 42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 64
  time_dim: 32
  num_layers: 1
  num_heads: 2
  num_neighbors: 5
  dropout: 0.1
training:
  pretrain_epochs: 5
  transfer_epochs: 3
  batch_size: 128
  total_batches_per_epoch: 32
  pretraining_strategy: conflict_aware
  domain_loss_coefficient: 0.1
proxy:
  calibration_fraction: 0.8
  calibration_steps: 20
  proxy_batch_size: 128
  proxy_batches: 4
  margin: 0.002
selection:
  selection_method: rasp
  proxy_windows: 3
  bootstrap_replicates: 1000
  bootstrap_confidence: 0.95
  risk_beta: 1.0
  size_penalty: 0.0
  beam_width: 2
  max_sources: 2
  candidate_budget: 8
evaluation:
  evaluation_protocol: ranking
  negative_policy: historical
  negatives_per_positive: 20
  evaluation_batch_size: 64
