name: smoke
datasets: [source_a, source_b, source_c, source_d, target]
targets: [target]
seeds: [42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 16
  time_dim: 8
  num_layers: 1
  num_heads: 2
  num_neighbors: 3
  dropout: 0.0
training:
  pretrain_epochs: 1
  transfer_epochs: 1
  batch_size: 8
  total_batches_per_epoch: 4
proxy:
  calibration_fraction: 0.8
  calibration_steps: 2
  proxy_batch_size: 8
  proxy_batches: 1
  margin: 0.002
