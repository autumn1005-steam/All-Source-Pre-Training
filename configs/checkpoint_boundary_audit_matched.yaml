name: checkpoint_boundary_audit_matched
datasets: [wikipedia, reddit, mooc]
targets: [wikipedia, reddit, mooc]
seeds: [0, 1, 2, 3, 42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 64
  time_dim: 32
  num_layers: 1
  num_heads: 2
  num_neighbors: 5
  dropout: 0.1
  source_experts: true
  expert_identity_init: true
  risk_controlled_routing: true
training:
  pretrain_epochs: 5
  transfer_epochs: 3
  checkpoint_selection_mode: validation
  batch_size: 128
  total_batches_per_epoch: 32
  pretraining_strategy: conflict_aware
  transfer_regret_weight: 0.25
  transfer_regret_mode: event_pairwise
  target_gate_mode: holdout_lcb_hard
  target_gate_windows: 5
  target_gate_bootstrap_replicates: 2000
  target_gate_confidence: 0.95
  target_gate_min_gain: 0.0
  target_gate_temperature: 0.01
  target_calibration_fraction: 0.2
  target_calibration_min_events: 128
  target_reference_weight: 1.0
  target_gate_negatives: 20
  transfer_regret_margin: 0.0
proxy:
  proxy_metric: mrr
  proxy_negative_policy: historical
selection:
  selection_method: rasp
  proxy_windows: 3
  bootstrap_replicates: 1000
  bootstrap_confidence: 0.95
  risk_beta: 1.0
  size_penalty: 0.0
  beam_width: 2
  max_sources: 2
  candidate_budget: 8
evaluation:
  evaluation_protocol: ranking
  negative_policy: historical
  negatives_per_positive: 20
  evaluation_batch_size: 64
