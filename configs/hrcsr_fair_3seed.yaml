name: hrcsr_fair_three_seed_corrected_negatives
datasets: [wikipedia, reddit, mooc]
targets: [wikipedia, reddit]
seeds: [0, 1, 42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 32
  time_dim: 16
  num_layers: 1
  num_heads: 2
  num_neighbors: 5
  dropout: 0.1
  source_experts: true
  expert_identity_init: true
  risk_controlled_routing: true
  router_temperature: 1.0
  router_prior_strength: 1.0
  router_entropy_penalty: 1.0
  router_abstain_bias: -1.0
training:
  pretrain_epochs: 5
  transfer_epochs: 3
  batch_size: 128
  total_batches_per_epoch: 32
  pretraining_strategy: conflict_aware
  affinity_temperature: 0.1
  minimum_source_batches: 1
  domain_adversarial_scale: 1.0
  domain_loss_coefficient: 0.1
  transfer_regret_weight: 0.25
  transfer_regret_margin: 0.0
  transfer_regret_mode: event_pairwise
  target_gate_mode: lcb_soft
  target_gate_windows: 5
  target_gate_bootstrap_replicates: 1000
  target_gate_confidence: 0.95
  target_gate_min_gain: 0.0
  target_gate_temperature: 0.01
proxy:
  calibration_fraction: 0.8
  calibration_steps: 20
  proxy_batch_size: 128
  proxy_batches: 4
  proxy_metric: mrr
  proxy_negative_policy: historical
selection:
  selection_method: rasp
  proxy_windows: 3
  bootstrap_replicates: 1000
  bootstrap_confidence: 0.95
  risk_beta: 1.0
  size_penalty: 0.0
  beam_width: 2
  max_sources: 2
  candidate_budget: 3
  min_risk_adjusted_gain: 0.002
  consistent_candidate_weights: true
  temporal_paired_gate: true
evaluation:
  evaluation_protocol: ranking
  negative_policy: historical
  negatives_per_positive: 20
  evaluation_batch_size: 64
