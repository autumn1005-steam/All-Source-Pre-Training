name: rasp_smoke_non_paper
datasets: [source_a, source_b, source_c, target]
targets: [target]
seeds: [42]
time_encoding_mode: paper_sincos
model:
  shared_dim: 8
  time_dim: 4
  num_layers: 1
  num_heads: 2
  num_neighbors: 2
  dropout: 0.0
training:
  pretrain_epochs: 1
  transfer_epochs: 1
  batch_size: 8
  total_batches_per_epoch: 3
  pretraining_strategy: conflict_aware
  affinity_temperature: 0.2
  minimum_source_batches: 1
  domain_adversarial_scale: 1.0
  domain_loss_coefficient: 0.1
proxy:
  calibration_fraction: 0.7
  calibration_steps: 1
  proxy_batch_size: 4
  proxy_batches: 1
  margin: 0.002
selection:
  selection_method: rasp
  proxy_windows: 2
  bootstrap_replicates: 32
  bootstrap_confidence: 0.9
  risk_beta: 1.0
  size_penalty: 0.001
  beam_width: 2
  max_sources: 2
  candidate_budget: 6
  min_risk_adjusted_gain: 0.0
evaluation:
  evaluation_protocol: ranking
  negative_policy: historical
  negatives_per_positive: 8
  evaluation_batch_size: 8
